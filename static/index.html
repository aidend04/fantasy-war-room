<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a20">
<title>War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface2:#eceef2; --surface3:#e2e5ea; --border:#dcdfe5; --text:#15181d; --muted:#5d6570; --faint:#9aa2ad;
  --accent:#b5850e; --accent-ink:#fff; --accent-soft:#f5ead0; --accent-line:#e3c97f;
  --good:#1e8a58; --warn:#c46d18; --bad:#c43f4c; --good-soft:#ddf2e6; --warn-soft:#fbe8d3; --bad-soft:#f9dde0;
  --QB:#c43f4c; --RB:#1e8a58; --WR:#2569b0; --TE:#c46d18; --K:#7448c9; --DEF:#5c6a2e;
  --row:#f8f9fb; --shadow:0 1px 2px rgba(20,24,30,.05),0 8px 24px rgba(20,24,30,.06);
  --radius:14px; --radius-s:9px; --nav-h:60px; --top-h:56px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1014; --surface:#151a20; --surface2:#1c222a; --surface3:#242b35; --border:#262d37; --text:#eef1f5; --muted:#98a2ae; --faint:#5a6370;
  --accent:#e9b54a; --accent-ink:#1b1500; --accent-soft:#2f2711; --accent-line:#5c4a18;
  --good:#4fc28a; --warn:#f2a55a; --bad:#f07882; --good-soft:#15301f; --warn-soft:#352914; --bad-soft:#3a1d22;
  --QB:#f07882; --RB:#4fc28a; --WR:#5aa9e6; --TE:#f2a55a; --K:#b58bf0; --DEF:#a8b08a;
  --row:#181d24; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --surface:#151a20; --surface2:#1c222a; --surface3:#242b35; --border:#262d37; --text:#eef1f5; --muted:#98a2ae; --faint:#5a6370;
  --accent:#e9b54a; --accent-ink:#1b1500; --accent-soft:#2f2711; --accent-line:#5c4a18;
  --good:#4fc28a; --warn:#f2a55a; --bad:#f07882; --good-soft:#15301f; --warn-soft:#352914; --bad-soft:#3a1d22;
  --QB:#f07882; --RB:#4fc28a; --WR:#5aa9e6; --TE:#f2a55a; --K:#b58bf0; --DEF:#a8b08a;
  --row:#181d24; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
body{padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.display{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-wrap:balance;margin:0}
h1{font-size:24px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
h2{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;position:relative;padding-left:12px}
h2::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:2px;background:var(--accent)}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-s);padding:7px 13px;cursor:pointer;min-height:36px;transition:background .12s,border-color .12s}
button:hover{border-color:var(--faint)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.tiny{padding:3px 9px;font-size:12px;min-height:28px;border-radius:7px}
button.ghost{background:transparent;border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:8px 11px;min-height:38px}
input[type=search]{min-width:200px}
input[type=checkbox]{min-height:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
label.f>*{font-size:14px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:400}
code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px}

/* ---- shell ---- */
.topbar{position:sticky;top:0;z-index:40;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.topbar .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.5px}
.topbar .brand small{color:var(--muted);font-size:12px}
.ctx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:transparent;border:0;padding:4px 8px;border-radius:var(--radius-s);text-align:left;min-height:0}
.ctx:hover{background:var(--surface2)}
.ctx .l1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ctx .l2{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ctx .l2.err{color:var(--bad)}
.topbar .actions{display:flex;gap:6px;flex:0 0 auto}
.iconbtn{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:10px}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:sticky;top:var(--top-h);z-index:30;display:flex;gap:2px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:11px 12px;min-height:0;font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
nav.bottom{display:none}
main{padding:18px 18px 60px;max-width:1500px;margin:0 auto}

/* sheets (settings, more, drawer) */
.sheet-bg{position:fixed;inset:0;background:rgba(6,8,12,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;height:100dvh;width:min(420px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);z-index:60;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet.open{transform:none}
.sheet .sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet label.f{gap:6px}
.sheet .row{display:flex;gap:8px}
.sheet .row>*{flex:1}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg,#drawer{transition:none}}

/* ---- layout ---- */
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.side{grid-template-columns:minmax(0,1fr) 360px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>h3{margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px 14px;min-width:0}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;line-height:1.05;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin-bottom:12px}
.toolbar .seg{display:flex;border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;background:var(--surface)}
.toolbar .seg button{border:0;border-radius:0;background:transparent;padding:7px 11px;min-height:36px;font-weight:600;font-size:13px}
.toolbar .seg button.on{background:var(--accent);color:var(--accent-ink)}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius-s)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none;z-index:1}
th.r,td.r{text-align:right}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
tr.mine td{background:var(--accent-soft)}
tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.dim td{opacity:.5}
tr.tierbreak td{border-top:2px solid var(--accent)}
td.wrap{white-space:normal;line-height:1.6}

/* ---- atoms ---- */
.pos{display:inline-block;min-width:34px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.6px;padding:2px 5px;border-radius:5px;color:#fff;background:var(--faint);vertical-align:middle}
.pos.QB{background:var(--QB)} .pos.RB{background:var(--RB)} .pos.WR{background:var(--WR)} .pos.TE{background:var(--TE)} .pos.K{background:var(--K)} .pos.DEF{background:var(--DEF)}
:root[data-theme="dark"] .pos,:root:not([data-theme="light"]) .pos{color:#0e1116}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .pos{color:#fff}}
:root[data-theme="light"] .pos{color:#fff}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .live{color:var(--good)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted);margin-left:4px;vertical-align:middle;line-height:1.4}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.live{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.final{background:var(--surface2)}
b.pn{cursor:pointer;border-bottom:1px dotted var(--faint);font-weight:600} b.pn:hover{color:var(--accent)}
.tier{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--faint)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle}
.barbg{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--surface3);vertical-align:middle;margin-right:6px}
.prob{display:inline-block;min-width:38px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.empty{padding:28px;text-align:center;color:var(--muted)}
.slot{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--muted);letter-spacing:.6px;width:70px}
.status{font-size:12px;color:var(--muted)} .status.err{color:var(--bad)}
.pick-list{display:flex;flex-wrap:wrap;gap:6px}
.pick-list span{padding:3px 9px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:var(--surface2)}
.pick-list span.next{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.pick-list span.done{opacity:.45;text-decoration:line-through}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start}
.vs .mid{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;color:var(--faint);padding-top:30px}
.big{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;line-height:1}
.injury{font-size:11px;font-weight:700;color:var(--bad);margin-left:4px} .injury.Q{color:var(--warn)}
.win{height:10px;border-radius:5px;background:var(--bad-soft);overflow:hidden;margin:8px 0} .win i{display:block;height:100%;background:var(--good)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cols .card{padding:10px 12px}
.cols ol{margin:0;padding-left:0;list-style:none}
.cols li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);font-size:13px}
.cols li.tb{border-top:2px solid var(--accent)}
.cols li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols li.rostered{opacity:.4;text-decoration:line-through}
.cols li.mine{color:var(--accent);font-weight:600}
.legend{font-size:12px;color:var(--muted);margin:6px 0 0}
.check{width:18px;height:18px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:no-preference){.dot.live{animation:pulse 1.6s infinite}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.guide{margin-bottom:16px;border-left:4px solid var(--border)}
.guide.clock{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),var(--surface) 45%)}
.guide-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.guide-pick{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
ul.why{margin:6px 0 10px;padding-left:18px;max-width:70ch} ul.why li{margin:3px 0}
ul.why li.bad{color:var(--bad)} ul.why li.warn{color:var(--warn)}
.alts{display:grid;gap:5px} .alts>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#drawer{position:fixed;top:0;right:0;height:100dvh;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);overflow-y:auto;padding:18px 20px calc(40px + env(safe-area-inset-bottom));z-index:70;transform:translateX(100%);transition:transform .2s}
#drawer.open{transform:none}
#drawer .close{position:sticky;top:0;float:right;z-index:2}
#drawer h2{font-size:26px;padding-left:0} #drawer h2::before{display:none}
#drawer .tiles{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))} #drawer .tile .v{font-size:24px}
.spark{display:block;width:100%;height:56px}
.spark rect{fill:var(--accent)} .spark rect.cur{fill:var(--good)} .spark rect.bye{fill:var(--faint)} .spark line{stroke:var(--border)} .spark text{fill:var(--muted);font-size:9px}

/* ---- mobile card lists (built alongside the widest tables) ---- */
.mlist{display:none;gap:8px}
.mcard{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.mcard .mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard .mhead>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .mact{display:flex;gap:6px;flex:0 0 auto}
.mcard .mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;margin-top:8px}
.mcard .mstats div{min-width:0}
.mcard .mstats .k{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;white-space:nowrap}
.mcard .mstats .v{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.mine{border-color:var(--accent);background:var(--accent-soft)}
.mcard.dim{opacity:.55}

/* ---- responsive ---- */
@media (max-width:1000px){.grid.cols-2,.grid.side{grid-template-columns:1fr}}
@media (max-width:760px){
  :root{--top-h:54px}
  .topbar{padding:0 10px;gap:8px} .topbar .brand small{display:none} .topbar h1{display:none}
  nav.tabs{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border)}
  nav.bottom button{background:none;border:0;border-radius:0;padding:6px 2px 4px;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
  nav.bottom button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav.bottom button.on{color:var(--accent)}
  main{padding:12px 12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
  .card{padding:12px 12px;border-radius:12px}
  .tiles{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 -12px 12px;padding:0 12px 4px;scrollbar-width:none}
  .tiles::-webkit-scrollbar{display:none}
  .tile{flex:0 0 46%;scroll-snap-align:start;padding:9px 12px} .tile .v{font-size:26px}
  #drawer .tiles{display:grid;grid-template-columns:repeat(2,1fr);margin:0;padding:0}
  #drawer .tile{flex:none}
  .toolbar{gap:8px} .toolbar .seg{width:100%;justify-content:space-between} .toolbar .seg button{flex:1;padding:7px 4px;font-size:12px}
  .toolbar input[type=search]{min-width:0;width:100%}
  .toolbar label.f{width:100%}
  table{font-size:12px} th,td{padding:5px 6px} .opt{display:none}
  .desk{display:none} .mlist{display:grid}
  .vs{grid-template-columns:1fr} .vs .mid{display:none}
  .big{font-size:32px} .guide-pick .display{font-size:26px!important}
  .pick-list span{font-size:11px;padding:2px 6px}
  .cols{grid-template-columns:1fr 1fr}
  .cols .card{padding:8px 8px} .cols li{font-size:12px}
  .sheet{width:100vw;border-left:0;border-radius:0}
  #drawer{width:100vw}
  .win{height:12px}
  h2{font-size:18px}
}
@media (max-width:420px){.cols{grid-template-columns:1fr} .mcard .mstats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="mark">WR</div><h1>War Room</h1><small id="season-tag">Sleeper · 2026</small></div>
  <button class="ctx" id="btn-ctx" title="League, week and settings"><span class="l1" id="ctx-l1">Rankings only</span><span class="l2 status" id="status">Loading player data…</span></button>
  <div class="actions">
    <button class="iconbtn" id="btn-refresh" title="Re-fetch league data" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    <button class="iconbtn" id="btn-settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</div>
<nav class="tabs" id="tabs">

<script>
/* ---------- utilities ---------- */

}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = n => (n == null || isNaN(n)) ? '–' : (Math.round(n * 10) / 10).toFixed(1);

const pct = n => (n == null || isNaN(n)) ? '–' : Math.round(n * 100) + '%';

const POS = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
const FLEX = { FLEX: ['RB', 'WR', 'TE'], SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'], REC_FLEX: ['WR', 'TE'], WRRB_FLEX: ['RB', 'WR'], WR_RB_FLEX: ['RB','WR'], RB_WR_FLEX: ['RB','WR'], WR_TE_FLEX: ['WR','TE'] };
const DEFAULT_ROSTER = ['QB', 'RB', 'RB', 'WR', 'WR', 'TE', 'FLEX', 'K', 'DEF', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN'];

/* ---------- state ---------- */
const S = {
  tab: LS.get('tab', 'draft'), username: LS.get('username', ''), leagueId: LS.get('leagueId', ''), defScoring: LS.get('defScoring', 'half'), sim: null, basis: LS.get('basis', 'ros'), matrix: null, vol: null, vegasOn: LS.get('vegas', true), games: null, weather: null, dvp: null, usage: null, lineupMode: LS.get('lineupMode', 'auto'), playoffWeeks: [15, 16, 17], schedule: null, faab: null, accuracy: null,
  state: null, players: {}, byes: {}, proj: {}, wk: {}, wkNum: null, ros: {}, rosFrom: null, s25: {}, adpF: {}, adpFmt: 'ppr', trend: { add: {}, drop: {} },
  user: null, leagues: [], league: null, rosters: [], users: [], draft: null, picks: [], matchups: [],
  scoring: null, rosterPositions: DEFAULT_ROSTER, teams: 12, P: [], byId: {},
  sort: {}, filters: { pos: 'ALL', q: '', hideRostered: true }, tradeSel: { mine: new Set(), theirs: new Set(), team: null, picksMine: new Set(), picksTheirs: new Set() }, keeperCost: {},
  pollTimer: null
};

/* ---------- scoring & value ---------- */
function scoreStats(stats) {
  if (!stats) return 0;
  if (!S.scoring) return stats[{ ppr: 'pts_ppr', half: 'pts_half_ppr', std: 'pts_std' }[S.defScoring]] || 0;
  let s = 0;
  for (const k in S.scoring) { const v = stats[k]; if (v) s += S.scoring[k] * v; }
  return s;
}
function slotCounts(rp) {
  if (S._slotsFor === rp && S._slots) return S._slots;

  for (const s of rp) { if (POS.includes(s)) fixed[s] = (fixed[s] || 0) + 1; else if (FLEX[s]) flex.push(FLEX[s]); }

  S._slotsFor = rp; S._slots = out; return out;
}
/* Value over replacement: fill every league-wide starting slot (fixed then flex) with the best available,
   then set replacement level a few bench spots deeper (RB/WR deeper than QB/TE, none for K/DEF). */
function computeVORP(players, key, out) {
  const { fixed, flex } = slotCounts(S.rosterPositions);
  const T = S.teams;
  const byPos = {}; POS.forEach(p => byPos[p] = players.filter(x => x.pos === p && x[key] > 0).sort((a, b) => b[key] - a[key]));
  const taken = {}; POS.forEach(p => taken[p] = Math.min(byPos[p].length, (fixed[p] || 0) * T));
  const flexSlots = []; flex.forEach(el => { for (let i = 0; i < T; i++) flexSlots.push(el); });
  for (const el of flexSlots) {
    let best = null, bp = null;
    for (const p of el) { const c = byPos[p][taken[p]]; if (c && (!best || c[key] > best[key])) { best = c; bp = p; } }
    if (bp) taken[bp]++;

  const isSF = flex.some(el => el.includes('QB'));

  const repl = {};
  for (const p of POS) {
    const idx = Math.round(taken[p] + benchShare[p] * T);
    const r = byPos[p][Math.min(idx, byPos[p].length - 1)];
    repl[p] = r ? r[key] : 0;
  }
  for (const p of players) p[out] = (p[key] || 0) - (repl[p.pos] || 0);
  return repl;
}
function assignTiers(players, key, out) {
  for (const pos of POS) {
    const arr = players.filter(x => x.pos === pos && x[key] > 0).sort((a, b) => b[key] - a[key]);
    if (!arr.length) continue;
    const thr = Math.max(arr[0][key] * 0.045, key === 'week' ? 1.5 : 4);
    let tier = 1;
    arr.forEach((p, i) => { if (i > 0 && arr[i - 1][key] - p[key] > thr) tier++; p[out] = tier; p[out + 'Rank'] = i + 1; });
  }
}
function rebuildPlayers() {
  const m = S.matrix, wk = S.wkNum; S.rosFrom = wk;
  const gameOf = {}; (S.games && S.gamesWeek === wk ? S.games : []).forEach(g => { gameOf[g.home] = g; gameOf[g.away] = g; });
  const implieds = Object.values(gameOf).filter(g => g.odds).flatMap(g => Object.values(g.odds.implied));
  const vegasAvg = implieds.length >= 8 ? sum(implieds) / implieds.length : null;
  const ids = new Set([...Object.keys(S.proj), ...Object.keys(m.players)]);
  const rosteredBy = {};
  for (const r of S.rosters) for (const pid of (r.players || [])) rosteredBy[pid] = r.roster_id;
  const adpKey = S.adpFmt === '2qb' ? 'adp_2qb' : S.adpFmt === 'half' ? 'adp_half_ppr' : S.adpFmt === 'std' ? 'adp_std' : 'adp_ppr';

    const sW = m.src.sleeper.weeks[wk] ? m.src.sleeper.weeks[wk][id] : undefined, eW = m.src.espn.weeks[wk] ? m.src.espn.weeks[wk][id] : undefined;
    const p = {
      id, name: pl.name, pos: pl.pos, team: pl.team, bye: S.byes[pl.team] || null, inj: inj ? inj.status : pl.inj, injNote: inj ? (inj.part || inj.note) : pl.injNote, age: pl.age, exp: pl.exp,
      season: m.season[id] ?? (sp ? scoreStats(sp) : 0), weekly: row,
      week: row ? row[wk - 1] : 0, ros: row ? sum(row.slice(wk - 1)) : 0, playoff: row ? sum(S.playoffWeeks.map(w => row[w - 1] || 0)) : 0,
      opp: m.opp[wk] ? m.opp[wk][id] : null,
      srcSeason: { sleeper: m.src.sleeper.season[id], espn: m.src.espn.season[id] }, srcWeek: { sleeper: sW, espn: eW },
      disagree: sW != null && eW != null && Math.abs(sW - eW) / Math.max((sW + eW) / 2, 6) > 0.3,
      gp: sp ? sp.gp : null, s25: S.s25[id] ? scoreStats(S.s25[id]) : null, s25gp: S.s25[id] ? S.s25[id].gp : null,
      adpS: sp && sp[adpKey] && sp[adpKey] < 900 ? sp[adpKey] : null,
      trendAdd: S.trend.add[id] || 0, trendDrop: S.trend.drop[id] || 0,
      rosterId: rosteredBy[id] ?? null

    if (f) { p.adpF = f.adp; p.adpSd = f.stdev; p.adpHi = f.high; p.adpLo = f.low; }
    p.adp = p.adpS ?? p.adpF ?? null;

  assignTiers(P, 'season', 'tierS'); assignTiers(P, 'ros', 'tierR'); assignTiers(P, 'val', 'tierV'); assignTiers(P, 'week', 'tierW');

}
/* Best lineup for a set of player ids under the league's slots, maximising `key`. */
function optimalLineup(ids, key, rp) {
  rp = rp || S.rosterPositions;
  const v = typeof key === 'function' ? key : (p => p[key] || 0);
  const avail = ids.map(id => S.byId[id]).filter(Boolean).map(p => { p._v = v(p) || 0; return p; }).sort((a, b) => b._v - a._v);
  const used = new Set(), slots = [];
  const take = (el) => { for (const p of avail) if (!used.has(p.id) && el.includes(p.pos)) { used.add(p.id); return p; } return null; };
  for (const s of rp) if (POS.includes(s)) slots.push({ slot: s, p: take([s]) });
  for (const s of rp) if (FLEX[s]) slots.push({ slot: s, p: take(FLEX[s]) });
  const bench = avail.filter(p => !used.has(p.id));
  const total = sum(slots.map(s => s.p ? s.p._v : 0));
  return { slots, bench, total };
}
function teamValue(ids, key) {
  const L = optimalLineup(ids, key);
  const benchTop = L.bench.slice(0, 4).map(p => Math.max(0, p[{ ros: 'vorpR', val: 'vorpV', season: 'vorpS', playoff: 'vorpP', week: 'vorpW' }[key] || 'vorpS'] || 0));
  return L.total + 0.35 * sum(benchTop);
}

/* ---------- draft helpers ---------- */
function pickNumber(round, slot, T, type, reversal) {
  if (type !== 'snake') return (round - 1) * T + slot;
  let fwd = round % 2 === 1;
  if (reversal && round >= reversal) fwd = !fwd;
  return (round - 1) * T + (fwd ? slot : T - slot + 1);
}
function slotAtPick(no, T, type, reversal) {
  const r = Math.floor((no - 1) / T) + 1;
  for (let s = 1; s <= T; s++) if (pickNumber(r, s, T, type, reversal) === no) return s;
  return null;
}
function myDraftInfo() {
  const d = S.draft; if (!d || !S.user) return null;
  const T = d.settings?.teams || S.teams, R = d.settings?.rounds || 15;
  let slot = d.draft_order?.[S.user.user_id];
  if (!slot && d.slot_to_roster_id && S.myRoster) { for (const [s, rid] of Object.entries(d.slot_to_roster_id)) if (rid === S.myRoster.roster_id) slot = +s; }
  if (!slot) return { T, R, slot: null, picks: [] };
  const picks = []; for (let r = 1; r <= R; r++) picks.push({ round: r, no: pickNumber(r, slot, T, d.type, d.settings?.reversal_round) });
  return { T, R, slot, picks };
}
function availProb(p, atPick) {
  const adp = p.adpF ?? p.adpS; if (!adp) return null;
  const sd = p.adpSd || Math.max(2.5, adp * 0.18);
  return 1 - Phi((atPick - 0.5 - adp) / sd);
}
/* A draft context abstracts "the real Sleeper draft" and "a mock draft" so the board, the

function liveCtx() {
  const d = S.draft; if (!d) return null;
  const info = myDraftInfo() || { T: d.settings?.teams || S.teams, R: d.settings?.rounds || 15, slot: null };
  const inv = {}; Object.entries(d.draft_order || {}).forEach(([uid, s]) => inv[s] = uid);
  const nameOf = s => { const u = S.users.find(x => x.user_id === inv[s]); if (u) return u.metadata?.team_name || u.display_name; const rid = d.slot_to_roster_id?.[s]; return rid ? teamName(rid) : 'Slot ' + s; };
  return { kind: 'live', type: d.type, T: info.T, R: info.R, reversal: d.settings?.reversal_round, picks: S.picks, slot: info.slot, status: d.status, nameOf,
    isMine: pk => S.myRoster ? pk.roster_id === S.myRoster.roster_id : (!!S.user && pk.picked_by === S.user.user_id),
    keyOf: pk => pk.roster_id, nameOfKey: rid => teamName(rid), myKey: S.myRoster ? S.myRoster.roster_id : null };
}
function mockCtx(m) {

    nameOf: s => m.names[s] || 'Team ' + s, isMine: pk => pk.draft_slot === m.slot, keyOf: pk => pk.draft_slot, nameOfKey: s => m.names[s] || 'Team ' + s, myKey: m.slot, mock: m };
}
function myPickNos(ctx) {
  const out = []; if (!ctx || !ctx.slot) return out;
  for (let r = 1; r <= ctx.R; r++) out.push({ round: r, no: pickNumber(r, ctx.slot, ctx.T, ctx.type, ctx.reversal) });
  return out;

/* ---------- data loading ---------- */
function setStatus(t, err) { const el = $('#status'); el.textContent = t; el.className = 'l2 status' + (err ? ' err' : ''); }
async function loadBase() {
  S.state = await api('state');
  const season = S.state.season; S.wkNum = S.wkNum || Math.max(1, S.state.display_week || S.state.week || 1);
  $('#season-tag').textContent = `Sleeper · ${season} · week ${S.state.display_week || S.state.week}`;
  const ws = $('#week-select'); ws.innerHTML = ''; for (let w = 1; w <= 18; w++) ws.append(new Option('Week ' + w, w)); ws.value = S.wkNum;
  const [players, byes, proj, s25, tAdd, tDrop] = await Promise.all([
    api('players'), api('byes?season=' + season), api('projections/season?season=' + season), api('stats/season?season=' + (season - 1)).catch(() => []),
    api('trending?type=add').catch(() => []), api('trending?type=drop').catch(() => []), loadMatrix(), api('volatility?season=' + (season - 1)).then(v => S.vol = v).catch(() => null),
    loadContext()
  ]);
  S.players = players; S.byes = byes.byes;
  S.proj = {}; proj.forEach(r => S.proj[r.id] = r.stats);
  S.s25 = {}; s25.forEach(r => S.s25[r.id] = r.stats);
  S.trend.add = {}; tAdd.forEach(t => S.trend.add[t.player_id] = t.count);
  S.trend.drop = {}; tDrop.forEach(t => S.trend.drop[t.player_id] = t.count);
  await loadADP();
}
/* Week context: games with odds and clock, weather, defense-vs-position, usage. Weather is slow
   the first time, so it fills in and re-renders when it arrives. */
async function loadContext() {
  const season = S.state.season, cur = S.state.week || 1, done = Math.max(0, cur - 1);
  const [games, dvp, usage] = await Promise.all([
    api(`games?season=${season}&week=${S.wkNum}`).catch(() => []),
    api(done >= 4 ? `dvp?season=${season}&through=${done}` : `dvp?season=${season - 1}&through=18`).catch(() => null),
    api(done >= 1 ? `usage?season=${season}&through=${done}` : `usage?season=${season - 1}&through=18`).catch(() => null)
  ]);
  S.games = games; S.gamesWeek = S.wkNum; S.dvp = dvp; S.usage = usage;
  api(`weather?season=${season}&week=${S.wkNum}`).then(w => { S.weather = w; if (S.tab === 'team' || S.tab === 'matchup') render(); }).catch(() => {});
}
/* Consensus projections for every week, scored with the league's own settings on the server. */
async function loadMatrix() {
  const r = await fetch('/api/matrix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ season: S.state.season, scoring: S.scoring || null, scoringKey: S.defScoring }) });
  const m = await r.json(); if (!r.ok || m.error) throw new Error(m.error || 'matrix failed');
  S.matrix = m; return m;
}
function setPlayoffWeeks() {
  const st = S.league ? S.league.settings : {};
  const start = st.playoff_week_start || 15, teams = st.playoff_teams || 6, rounds = Math.max(1, Math.ceil(Math.log2(teams)));
  S.playoffWeeks = []; for (let w = start; w < start + rounds && w <= 18; w++) S.playoffWeeks.push(w);
  const sel = $('#basis-select'); if (sel) sel.options[1].text = `Playoff weeks (${S.playoffWeeks[0]}–${S.playoffWeeks[S.playoffWeeks.length - 1]})`;
}
async function loadADP() {
  const sc = S.scoring || { rec: { ppr: 1, half: 0.5, std: 0 }[S.defScoring] };
  $('#scoring-wrap').style.display = S.scoring ? 'none' : '';
  const { flex } = slotCounts(S.rosterPositions);
  S.adpFmt = flex.some(el => el.includes('QB')) ? '2qb' : (sc.rec || 0) >= 1 ? 'ppr' : (sc.rec || 0) >= 0.5 ? 'half' : 'std';
  try {

    S.adpF = {}; S.adpMeta = a.meta;

      const myGain = teamValue(myIds.filter(id => !sIds.includes(id)).concat(gIds), key) - myBase; if (myGain < 4) continue;
      const thGain = teamValue(thIds.filter(id => !gIds.includes(id)).concat(sIds), key) - thBase; if (thGain < -3) continue;
      results.push({ rid: r.roster_id, send: s, get: g, myGain, thGain, score: myGain + 0.5 * Math.min(thGain, 15) });
    }
  }
  return results.sort((a, b) => b.score - a.score).slice(0, 15);
}

/* ---------- FAAB price model from the league's own bid history ---------- */
function faabModel() {
  if (!S.faab || !S.faab.bids) return null;
  const bids = S.faab.bids.filter(b => b.rank && b.budget);
  const bucketOf = (rank, pos) => (pos === 'K' || pos === 'DEF') ? 'kdef' : rank <= 12 ? 'starter' : rank <= 24 ? 'flex' : rank <= 40 ? 'bench' : 'dart';
  const phaseOf = w => w <= 4 ? 'early' : w <= 10 ? 'mid' : 'late';
  const groups = {};
  for (const b of bids) { const pctb = 100 * b.bid / b.budget; const bk = bucketOf(b.rank, b.pos); for (const k of [bk, bk + '/' + phaseOf(b.week), bk === 'kdef' ? 'kdef' : 'all']) { const g = groups[k] = groups[k] || { won: [], lost: 0 }; if (b.won) g.won.push(pctb); else g.lost++; } }
  const q = (arr, f) => { if (!arr.length) return null; const a = [...arr].sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(f * a.length))]; };
  const stat = k => { const g = groups[k]; if (!g) return null; return { n: g.won.length, lost: g.lost, median: q(g.won, 0.5), p75: q(g.won, 0.75), max: g.won.length ? Math.max(...g.won) : null }; };
  const budget = S.league.settings.waiver_budget || 100;
  const suggest = (rank, week, pos) => {
    const b = bucketOf(rank, pos), keys = [b + '/' + phaseOf(week), b, b === 'kdef' ? 'kdef' : 'all'];
    for (const k of keys) { const s = stat(k); if (s && s.n >= (k === 'all' ? 1 : k.includes('/') ? 4 : 3)) return { ...s, key: k, typical: Math.round(s.median * budget / 100), safe: Math.round(s.p75 * budget / 100) }; }
    return null;
  };
  return { suggest, stat, bucketOf, budget, n: bids.length, seasons: S.faab.seasons };
}

/* ---------- lineup alerts ---------- */
function lineupAlerts() {
  const r = S.myRoster; if (!r) return [];
  const starters = (r.starters || []).filter(id => id && id !== '0');
  const L = optimalLineup(r.players || [], 'week'), optIds = new Set(L.slots.filter(s => s.p).map(s => s.p.id));
  const out = [];
  for (const id of starters) {
    const p = S.byId[id];
    if (!p) { out.push({ sev: 'bad', text: 'A starting slot holds an unknown or empty player' }); continue; }
    if (p.bye === S.wkNum) out.push({ sev: 'bad', p, text: `${p.name} is on bye this week` });
    else if (['Out', 'IR', 'PUP', 'Sus', 'NA', 'Doubtful'].includes(p.inj)) out.push({ sev: 'bad', p, text: `${p.name} is ${p.inj}${p.injNote ? ' (' + p.injNote + ')' : ''}` });
    else if (p.inj === 'Questionable') out.push({ sev: 'warn', p, text: `${p.name} is questionable${p.injNote ? ' (' + p.injNote + ')' : ''}; check inactives before kickoff` });
    else if (p.week < 2) out.push({ sev: 'warn', p, text: `${p.name} projects only ${f1(p.week)} pts` });
  }
  const benchIn = L.slots.filter(s => s.p && !starters.includes(s.p.id)).map(s => s.p), startOut = starters.map(id => S.byId[id]).filter(p => p && !optIds.has(p.id));
  const cur = sum(starters.map(id => S.byId[id] ? S.byId[id].week : 0));
  if (benchIn.length && L.total - cur > 0.5) out.push({ sev: 'warn', text: `Start ${benchIn.map(p => p.name).join(', ')} over ${startOut.map(p => p.name).join(', ') || 'the empty slot'} for +${f1(L.total - cur)} pts` });
  return out;
}

/* ---------- week context helpers ---------- */
function dvpRank(opp, pos) { const t = S.dvp && S.dvp.teams[opp]; const x = t && t[pos]; return x ? x : null; }
function weatherOf(team) { return S.weather && S.weather[team] ? S.weather[team] : null; }

}
/* Opponent cell: opponent, matchup difficulty from defense-vs-position, weather flags. */
function oppCell(p) {

function usageTrend(p) {

}

function mockDefaults() {

  const names = {}; for (let s = 1; s <= T; s++) names[s] = live && live.T === T && live.nameOf ? live.nameOf(s) : 'Bot ' + s;

function mockStart(cfg) {

  const m = { T: +cfg.T || d.T, R: +cfg.R || d.R, type: cfg.type || d.type, reversal: +cfg.reversal || 0, slot: +cfg.slot || d.slot, tau: +cfg.tau || 3.2, brain: cfg.brain || 'adp', picks: [], auto: false };

function mockBotTurn(m) {
  const no = m.picks.length + 1, slot = slotAtPick(no, m.T, m.type, m.reversal), round = Math.floor((no - 1) / m.T) + 1;
  const taken = new Set(m.picks.map(p => p.player_id));

  let p = botPick(cands, taken, comp, slot, round, m.R, m.tau, 22, m.brain !== 'adp-pure');
  if (!p) p = S.P.filter(x => !taken.has(x.id) && x.season > 0).sort((a, b) => b.vorpS - a.vorpS)[0];

/* How mock opponents rank the board. 'adp' mirrors real drafters; the others draft off an

function botOrder(brain, taken) {
  const avail = S.P.filter(p => !taken.has(p.id) && p.season > 0);
  if (brain === 'espn') return avail.filter(p => p.srcSeason.espn != null).sort((a, b) => b.srcSeason.espn - a.srcSeason.espn);
  if (brain === 'sleeper') return avail.filter(p => p.srcSeason.sleeper != null).sort((a, b) => b.srcSeason.sleeper - a.srcSeason.sleeper);

function viewKeeper() {
  if (!S.league || !S.myRoster) return needLeague();
  const st = S.league.settings, maxK = st.max_keepers || 0, prev = S.league.previous_league_id;
  if (S.keeperPrev === null && prev) { S.keeperPrev = 'loading'; api('sleeper/league/' + prev + '/drafts').then(async ds => { const d = ds.find(x => x.status === 'complete') || ds[0]; const picks = d ? await api('sleeper/draft/' + d.draft_id + '/picks') : []; const rounds = {}; picks.forEach(pk => { if (pk.picked_by === S.user.user_id) rounds[pk.player_id] = pk.round; }); S.keeperPrev = { rounds, R: d ? d.settings.rounds : null }; if (S.tab === 'keeper') render(); }).catch(() => { S.keeperPrev = { rounds: {}, R: null }; }); }
  const info = draftSlotInfo();
  const prevR = (S.keeperPrev && S.keeperPrev !== 'loading') ? S.keeperPrev : { rounds: {}, R: null };
  const rows = (S.myRoster.players || []).map(id => S.byId[id]).filter(p => p && p.season > 0).map(p => {
    const defRound = prevR.rounds[p.id] || info.R;
    const round = S.keeperCost[p.id] || defRound;
    const pick = info.pickNo(round), give = expectedVorpAtPick(pick);
    return { p, round, defRound, pick, give, surplus: p.vorpS - give, drafted: !!prevR.rounds[p.id] };
  }).sort((a, b) => b.surplus - a.surplus);
  return `<div class="card" style="margin-bottom:16px"><h2>Keeper decision</h2><div class="note" style="margin:6px 0">${maxK ? `This league allows <b>${maxK}</b> keeper${maxK > 1 ? 's' : ''}.` : 'This league has no keeper setting, but the math below still shows who would be worth keeping.'} Keeper value = the player's projected value over replacement minus the value you would expect to draft at the pick you give up (your slot ${info.slot || 'unknown'}, ${info.T} teams). Cost round defaults to the round you drafted him last season (undrafted = last round); edit it if your league uses a different rule.${S.keeperPrev === 'loading' ? ' Loading last season\'s draft…' : ''}</div>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th class="r">Proj</th><th class="r">VORP</th><th class="r">ADP</th><th class="r">Cost round</th><th class="r">= pick</th><th class="r">Pick worth</th><th class="r">Keeper value</th><th>Verdict</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr class="${i < maxK && r.surplus > 0 ? 'mine' : ''}"><td>${i + 1}</td><td>${pcell(r.p, { noOwner: true })}</td><td class="r">${f0(r.p.season)}</td><td class="r ${r.p.vorpS > 0 ? 'good' : 'muted'}">${f0(r.p.vorpS)}</td><td class="r muted">${f1(r.p.adp)}</td><td class="r"><input type="number" min="1" max="${info.R}" value="${r.round}" data-keeper="${r.p.id}" style="width:56px;padding:2px 6px"> ${r.drafted ? '' : '<span class="faint small">undrafted</span>'}</td><td class="r muted">#${r.pick}</td><td class="r muted">${f0(r.give)}</td><td class="r"><b class="${r.surplus > 0 ? 'good' : 'bad'}">${r.surplus > 0 ? '+' : ''}${f0(r.surplus)}</b></td><td class="small">${r.surplus > 25 ? '<span class="good">Keep, clear win</span>' : r.surplus > 5 ? '<span class="good">Keep</span>' : r.surplus > -5 ? 'Toss-up' : '<span class="muted">Throw back</span>'}</td></tr>`).join('')}
    </tbody></table></div><div class="note">Pick worth = average value over replacement of the players going around that pick by ADP. A keeper is a bargain when his own value beats that number.</div></div>`;
}

      ${acc && Object.keys(acc.sources).length ? `<div class="tablewrap"><table><thead><tr><th>Source</th>${POS.map(p => `<th class="r">${p}</th>`).join('')}<th class="r">All MAE</th><th class="r">Bias</th></tr></thead><tbody>${Object.entries(acc.sources).map(([s, per]) => `<tr><td><b>${s}</b></td>${srcRow(per)}</tr>`).join('')}</tbody></table></div><div class="note">Mean absolute error in PPR points per player-week (players projected 5+ pts). Bias = actual minus projected: positive means the source runs low. Weights switch to inverse-MSE once both sources have 100+ graded player-weeks.</div>` : `<div class="empty">No completed weeks yet. Each week's projections are frozen on load; once games finish, actuals are pulled and graded here, and the consensus reweights automatically.</div>`}
    </div>
    <div class="card"><h2>Biggest disagreements · week ${S.wkNum}</h2><div class="tablewrap"><table><thead><tr><th>Player</th><th class="r">Sleeper</th><th class="r">ESPN</th><th class="r">Δ</th></tr></thead><tbody>${dis.map(({ p, d }) => `<tr><td>${pcell(p)}</td><td class="r">${f1(p.srcWeek.sleeper)}</td><td class="r">${f1(p.srcWeek.espn)}</td><td class="r ${d > 0 ? 'good' : 'bad'}">${d > 0 ? '+' : ''}${f1(d)}</td></tr>`).join('')}</tbody></table></div><div class="note">Where the sources split, the truth is usually in between, but a big gap is a signal to read the news before you commit. Players with a ± chip elsewhere in the app are on this list.</div></div></div>`;
}

/* ---------- boot ---------- */
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; LS.set('tab', S.tab); closeSheets(); window.scrollTo({ top: 0 }); render(); });
function openSheet(id) { closeSheets(); $('#' + id).classList.add('open'); $('#' + id).setAttribute('aria-hidden', 'false'); $('#sheet-bg').classList.add('open'); }
function closeSheets() { document.querySelectorAll('.sheet').forEach(s => { s.classList.remove('open'); s.setAttribute('aria-hidden', 'true'); }); $('#sheet-bg').classList.remove('open'); }
$('#btn-settings').onclick = () => openSheet('settings');
$('#btn-ctx').onclick = () => openSheet('settings');
$('#btn-more').onclick = () => openSheet('more');
$('#sheet-bg').onclick = closeSheets;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
function applyTheme(t) { if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(LS.get('theme', 'auto')); $('#theme-select').value = LS.get('theme', 'auto');
$('#theme-select').onchange = e => { LS.set('theme', e.target.value); applyTheme(e.target.value); };
function updateCtx() { const l1 = $('#ctx-l1'); if (!l1) return; l1.textContent = (S.league ? S.league.name : 'Rankings only') + (S.wkNum ? ' · Week ' + S.wkNum : ''); }
$('#user-form').onsubmit = e => { e.preventDefault(); loadUser().catch(er => setStatus('Could not load user: ' + er.message, true)); };
$('#league-select').onchange = e => { S.leagueId = e.target.value; loadLeague().catch(er => setStatus(er.message, true)); };
$('#week-select').onchange = e => { setStatus('Loading week ' + e.target.value + '…'); loadWeek(+e.target.value).then(() => setStatus('Week ' + S.wkNum + ' loaded')).catch(er => setStatus(er.message, true)); };
$('#scoring-select').value = S.defScoring;
$('#vegas-select').value = S.vegasOn ? '1' : '0';
$('#vegas-select').onchange = e => { S.vegasOn = e.target.value === '1'; LS.set('vegas', S.vegasOn); rebuildPlayers(); render(); };
$('#basis-select').value = S.basis;
$('#basis-select').onchange = e => { S.basis = e.target.value; LS.set('basis', S.basis); rebuildPlayers(); render(); };
$('#scoring-select').onchange = e => { S.defScoring = e.target.value; LS.set('defScoring', S.defScoring); Promise.all([loadADP(), loadMatrix()]).then(() => { rebuildPlayers(); render(); setStatus('Rankings only · default 12-team ' + e.target.selectedOptions[0].text); }); };
$('#btn-refresh').onclick = () => (S.leagueId ? loadLeague() : Promise.resolve()).catch(er => setStatus(er.message, true));
(async () => {
  try {
    $('#username').value = S.username;
    await loadBase();
    rebuildPlayers(); render();
    setStatus('Rankings ready · default 12-team ' + $('#scoring-select').selectedOptions[0].text);
    if (S.username) await loadUser();
  } catch (e) { setStatus('Load failed: ' + e.message, true); $('#view').innerHTML = `<div class="empty bad">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
