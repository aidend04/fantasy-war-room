<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface2:#ebe9e3; --border:#d9d5cc; --text:#1c1e23; --muted:#646a73; --faint:#9aa0a8;
  --accent:#b8800f; --accent-ink:#fff; --accent-soft:#f5e7c4;
  --good:#1f8f5a; --warn:#c9701a; --bad:#c9414e; --good-soft:#dff3e8; --warn-soft:#fbe9d6; --bad-soft:#f9dfe1;
  --QB:#c9414e; --RB:#1f8f5a; --WR:#2470b8; --TE:#c9701a; --K:#7a4fcf; --DEF:#5f6b33;
  --row:#faf9f6; --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(20,20,10,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171c; --surface:#1c2027; --surface2:#242933; --border:#2e343e; --text:#e8eaee; --muted:#98a0ac; --faint:#5f6672;
  --accent:#e0a93b; --accent-ink:#1a1400; --accent-soft:#3a2f12;
  --good:#4fc28a; --warn:#f2a55a; --bad:#f07882; --good-soft:#173326; --warn-soft:#3a2a14; --bad-soft:#3b1d21;
  --QB:#f07882; --RB:#4fc28a; --WR:#5aa9e6; --TE:#f2a55a; --K:#b58bf0; --DEF:#a8b08a;
  --row:#191d23; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#14171c; --surface:#1c2027; --surface2:#242933; --border:#2e343e; --text:#e8eaee; --muted:#98a0ac; --faint:#5f6672;
  --accent:#e0a93b; --accent-ink:#1a1400; --accent-soft:#3a2f12;
  --good:#4fc28a; --warn:#f2a55a; --bad:#f07882; --good-soft:#173326; --warn-soft:#3a2a14; --bad-soft:#3b1d21;
  --QB:#f07882; --RB:#4fc28a; --WR:#5aa9e6; --TE:#f2a55a; --K:#b58bf0; --DEF:#a8b08a;
  --row:#191d23; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,.display{font-family:"Barlow Condensed","Arial Narrow",sans-serif;text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
h2{font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
h3{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.tiny{padding:2px 8px;font-size:12px;border-radius:4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px}
input[type=search]{min-width:200px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label.f>*{font-size:14px;text-transform:none;letter-spacing:0;color:var(--text)}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
header .brand{display:flex;align-items:baseline;gap:10px}
header .brand small{color:var(--muted);font-size:12px}
header .spacer{flex:1}
nav.tabs{display:flex;gap:2px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 14px;font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.side{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1000px){.grid.cols-2,.grid.side{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:600;line-height:1.1;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin-bottom:12px}
.toolbar .seg{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.toolbar .seg button{border:0;border-radius:0;background:var(--surface);padding:5px 10px}
.toolbar .seg button.on{background:var(--accent);color:var(--accent-ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
tbody tr:nth-child(even){background:var(--row)}
tbody tr:hover{background:var(--surface2)}
tr.mine td{background:var(--accent-soft)}
tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.dim td{opacity:.45}
.pos{display:inline-block;min-width:34px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;padding:1px 5px;border-radius:4px;color:#fff;background:var(--faint)}
.pos.QB{background:var(--QB)} .pos.RB{background:var(--RB)} .pos.WR{background:var(--WR)} .pos.TE{background:var(--TE)} .pos.K{background:var(--K)} .pos.DEF{background:var(--DEF)}
:root[data-theme="dark"] .pos,{color:#101318}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--border);color:var(--muted);margin-left:4px;vertical-align:middle}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tier{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--faint)}
tr.tierbreak td{border-top:2px solid var(--accent)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;opacity:.85}
.barbg{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--surface2);vertical-align:middle;margin-right:6px}
.prob{display:inline-block;min-width:38px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.slot{font-family:"Barlow Condensed",sans-serif;font-weight:600;color:var(--muted);letter-spacing:.5px;width:70px}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--bad)}
.pick-list{display:flex;flex-wrap:wrap;gap:6px}
.pick-list span{padding:2px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px}
.pick-list span.next{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.pick-list span.done{opacity:.5;text-decoration:line-through}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start}
.vs .mid{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;color:var(--muted);padding-top:30px}
.big{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;line-height:1}
.injury{font-size:11px;font-weight:600;color:var(--bad);margin-left:4px}
.injury.Q{color:var(--warn)}
.win{height:10px;border-radius:5px;background:var(--bad-soft);overflow:hidden;margin:8px 0}
.win i{display:block;height:100%;background:var(--good)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cols .card{padding:10px 12px}
.cols ol{margin:0;padding-left:0;list-style:none}
.cols li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--border);font-size:13px}
.cols li.tb{border-top:2px solid var(--accent)}
.cols li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols li.rostered{opacity:.4;text-decoration:line-through}
.cols li.mine{color:var(--accent);font-weight:600}
.legend{font-size:12px;color:var(--muted);margin:6px 0 0}
.check{width:15px;height:15px}
td.wrap{white-space:normal;line-height:1.7}
@media (prefers-reduced-motion:no-preference){ .live{animation:pulse 1.6s infinite} }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.guide{margin-bottom:16px;border-left:4px solid var(--border)}
.guide.clock{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),var(--surface) 40%)}
.guide-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.guide-pick{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
ul.why{margin:6px 0 10px;padding-left:18px;max-width:70ch}
ul.why li{margin:2px 0}
.alts{display:grid;gap:4px}
.alts>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
ul.why li.bad{color:var(--bad)} ul.why li.warn{color:var(--warn)}
code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>War Room</h1><small id="season-tag">Sleeper · 2026</small></div>
  <form id="user-form" style="display:contents"><label class="f">Sleeper username <span style="display:flex;gap:6px"><input id="username" placeholder="your Sleeper username" size="18" autocomplete="off"><button class="primary" id="btn-load" type="submit">Load</button></span></label></form>
  <label class="f">League <select id="league-select"><option value="">— rankings only —</option></select></label>
  <label class="f" id="scoring-wrap">Scoring (no league) <select id="scoring-select"><option value="half">Half PPR</option><option value="ppr">Full PPR</option><option value="std">Standard</option></select></label>
  <label class="f">Week <select id="week-select"></select></label>
  <label class="f">Value basis <select id="basis-select"><option value="ros">Rest of season</option><option value="playoff">Playoff weeks only</option><option value="blend">ROS + playoffs ×2</option></select></label>
  <div class="spacer"></div>
  <div class="status" id="status">Loading player data…</div>
  <button id="btn-refresh" title="Re-fetch league data">Refresh</button>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="draft">Draft</button>
  <button data-tab="mock">Mock</button>
  <button data-tab="tiers">Tiers</button>
  <button data-tab="team">My Team</button>
  <button data-tab="waivers">Waivers</button>
  <button data-tab="matchup">Matchup</button>
  <button data-tab="league">League</button>
  <button data-tab="trade">Trade</button>
  <button data-tab="model">Model</button>
</nav>
<main id="view"><div class="empty">Loading projections, ADP and player data…</div></main>

<script>
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem('wr.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('wr.' + k, JSON.stringify(v)); } catch {} }
};
async function api(p) {
  const r = await fetch('/api/' + p);
  const j = await r.json();
  if (!r.ok || (j && j.error)) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = n => (n == null || isNaN(n)) ? '–' : (Math.round(n * 10) / 10).toFixed(1);
const f0 = n => (n == null || isNaN(n)) ? '–' : Math.round(n).toString();
const pct = n => (n == null || isNaN(n)) ? '–' : Math.round(n * 100) + '%';
const sum = a => a.reduce((x, y) => x + y, 0);
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y;}
const Phi = x => 0.5 * (1 + erf(x / Math.SQRT2));
const normName = s => (s || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, '').replace(/[^a-z]/g, '');
const POS = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
const FLEX = { FLEX: ['RB', 'WR', 'TE'], SUPER_FLEX: ['QB', 'RB', 'WR', 'TE'], REC_FLEX: ['WR', 'TE'], WRRB_FLEX: ['RB', 'WR'], WR_RB_FLEX: ['RB','WR'], RB_WR_FLEX: ['RB','WR'], WR_TE_FLEX: ['WR','TE'] };
const DEFAULT_ROSTER = ['QB', 'RB', 'RB', 'WR', 'WR', 'TE', 'FLEX', 'K', 'DEF', 'BN', 'BN', 'BN', 'BN', 'BN', 'BN'];

/* ---------- state ---------- */
const S = {
  tab: LS.get('tab', 'draft'), username: LS.get('username', ''), leagueId: LS.get('leagueId', ''), defScoring: LS.get('defScoring', 'half'), sim: null, basis: LS.get('basis', 'ros'), matrix: null, playoffWeeks: [15, 16, 17], schedule: null, faab: null, accuracy: null,
  state: null, players: {}, byes: {}, proj: {}, wk: {}, wkNum: null, ros: {}, rosFrom: null, s25: {}, adpF: {}, adpFmt: 'ppr', trend: { add: {}, drop: {} },
  user: null, leagues: [], league: null, rosters: [], users: [], draft: null, picks: [], matchups: [],
  scoring: null, rosterPositions: DEFAULT_ROSTER, teams: 12, P: [], byId: {},
  sort: {}, filters: { pos: 'ALL', q: '', hideRostered: true }, tradeSel: { mine: new Set(), theirs: new Set(), team: null },
  pollTimer: null
};

/* ---------- scoring & value ---------- */
function scoreStats(stats) {
  if (!stats) return 0;
  if (!S.scoring) return stats[{ ppr: 'pts_ppr', half: 'pts_half_ppr', std: 'pts_std' }[S.defScoring]] || 0;
  let s = 0;
  for (const k in S.scoring) { const v = stats[k]; if (v) s += S.scoring[k] * v; }
  return s;
}
function slotCounts(rp) {
  if (S._slotsFor === rp && S._slots) return S._slots;
  const fixed = {}, flex = [];
  for (const s of rp) { if (POS.includes(s)) fixed[s] = (fixed[s] || 0) + 1; else if (FLEX[s]) flex.push(FLEX[s]); }
  const out = { fixed, flex, bench: rp.filter(s => s === 'BN').length };
  S._slotsFor = rp; S._slots = out; return out;
}
/* Value over replacement: fill every league-wide starting slot (fixed then flex) with the best available,
   then set replacement level a few bench spots deeper (RB/WR deeper than QB/TE, none for K/DEF). */
function computeVORP(players, key, out) {
  const { fixed, flex } = slotCounts(S.rosterPositions);
  const T = S.teams;
  const byPos = {}; POS.forEach(p => byPos[p] = players.filter(x => x.pos === p && x[key] > 0).sort((a, b) => b[key] - a[key]));
  const taken = {}; POS.forEach(p => taken[p] = Math.min(byPos[p].length, (fixed[p] || 0) * T));
  const flexSlots = []; flex.forEach(el => { for (let i = 0; i < T; i++) flexSlots.push(el); });
  for (const el of flexSlots) {
    let best = null, bp = null;
    for (const p of el) { const c = byPos[p][taken[p]]; if (c && (!best || c[key] > best[key])) { best = c; bp = p; } }
    if (bp) taken[bp]++;
  }
  const isSF = flex.some(el => el.includes('QB'));
  const benchShare = { QB: isSF ? 1 : 0.5, RB: 1.5, WR: 1.5, TE: 0.5, K: 0, DEF: 0 };
  const repl = {};
  for (const p of POS) {
    const idx = Math.round(taken[p] + benchShare[p] * T);
    const r = byPos[p][Math.min(idx, byPos[p].length - 1)];
    repl[p] = r ? r[key] : 0;
  }
  for (const p of players) p[out] = (p[key] || 0) - (repl[p.pos] || 0);
  return repl;
}
function assignTiers(players, key, out) {
  for (const pos of POS) {
    const arr = players.filter(x => x.pos === pos && x[key] > 0).sort((a, b) => b[key] - a[key]);
    if (!arr.length) continue;
    const thr = Math.max(arr[0][key] * 0.045, key === 'week' ? 1.5 : 4);
    let tier = 1;
    arr.forEach((p, i) => { if (i > 0 && arr[i - 1][key] - p[key] > thr) tier++; p[out] = tier; p[out + 'Rank'] = i + 1; });
  }
}
function rebuildPlayers() {
  const m = S.matrix, wk = S.wkNum; S.rosFrom = wk;
  const ids = new Set([...Object.keys(S.proj), ...Object.keys(m.players)]);
  const rosteredBy = {};
  for (const r of S.rosters) for (const pid of (r.players || [])) rosteredBy[pid] = r.roster_id;
  const adpKey = S.adpFmt === '2qb' ? 'adp_2qb' : S.adpFmt === 'half' ? 'adp_half_ppr' : S.adpFmt === 'std' ? 'adp_std' : 'adp_ppr';
  const P = [];
  for (const id of ids) {
    const pl = S.players[id]; if (!pl) continue;
    const sp = S.proj[id], row = m.players[id] || null, inj = m.injuries[id];
    const sW = m.src.sleeper.weeks[wk] ? m.src.sleeper.weeks[wk][id] : undefined, eW = m.src.espn.weeks[wk] ? m.src.espn.weeks[wk][id] : undefined;
    const p = {
      id, name: pl.name, pos: pl.pos, team: pl.team, bye: S.byes[pl.team] || null, inj: inj ? inj.status : pl.inj, injNote: inj ? (inj.part || inj.note) : pl.injNote, age: pl.age, exp: pl.exp,
      season: m.season[id] ?? (sp ? scoreStats(sp) : 0), weekly: row,
      week: row ? row[wk - 1] : 0, ros: row ? sum(row.slice(wk - 1)) : 0, playoff: row ? sum(S.playoffWeeks.map(w => row[w - 1] || 0)) : 0,
      opp: m.opp[wk] ? m.opp[wk][id] : null,
      srcSeason: { sleeper: m.src.sleeper.season[id], espn: m.src.espn.season[id] }, srcWeek: { sleeper: sW, espn: eW },
      disagree: sW != null && eW != null && Math.abs(sW - eW) / Math.max((sW + eW) / 2, 6) > 0.3,
      gp: sp ? sp.gp : null, s25: S.s25[id] ? scoreStats(S.s25[id]) : null, s25gp: S.s25[id] ? S.s25[id].gp : null,
      adpS: sp && sp[adpKey] && sp[adpKey] < 900 ? sp[adpKey] : null,
      trendAdd: S.trend.add[id] || 0, trendDrop: S.trend.drop[id] || 0,
      rosterId: rosteredBy[id] ?? null
    };
    const f = S.adpF[pl.pos === 'DEF' ? 'DEF:' + pl.team : normName(pl.name) + ':' + pl.pos];
    if (f) { p.adpF = f.adp; p.adpSd = f.stdev; p.adpHi = f.high; p.adpLo = f.low; }
    p.adp = p.adpS ?? p.adpF ?? null;
    p.val = S.basis === 'playoff' ? p.playoff : S.basis === 'blend' ? p.ros + p.playoff : p.ros;
    P.push(p);
  }
  S.P = P; S.byId = {}; P.forEach(p => S.byId[p.id] = p); S.odds = null; S.trades = null;
  S.replS = computeVORP(P, 'season', 'vorpS');
  S.replR = computeVORP(P, 'ros', 'vorpR');
  S.replV = computeVORP(P, 'val', 'vorpV');
  computeVORP(P, 'week', 'vorpW'); computeVORP(P, 'playoff', 'vorpP');
  assignTiers(P, 'season', 'tierS'); assignTiers(P, 'ros', 'tierR'); assignTiers(P, 'val', 'tierV'); assignTiers(P, 'week', 'tierW');
  const ranked = [...P].sort((a, b) => b.vorpS - a.vorpS); ranked.forEach((p, i) => p.rankS = i + 1);
  const rankedR = [...P].sort((a, b) => b.vorpV - a.vorpV); rankedR.forEach((p, i) => p.rankV = i + 1);
}
/* Best lineup for a set of player ids under the league's slots, maximising `key`. */
function optimalLineup(ids, key, rp) {

function randn(rng) { let u = 0, v = 0; while (u === 0) u = rng(); while (v === 0) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function randomPairs(rids, rng) { const a = [...rids]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } const out = []; for (let i = 0; i + 1 < a.length; i += 2) out.push([a[i], a[i + 1]]); return out; }
function currentRosterMap() { const m = {}; S.rosters.forEach(r => m[r.roster_id] = r.players || []); return m; }
/* Monte Carlo of the remaining schedule. Weekly team score ~ Normal(best-lineup projection, spread).
   Standings by wins then points; bracket seeded from the league's playoff settings. Same seed each
   call so "what if" deltas use common random numbers. */
function simSeason(rosterMap, opts = {}) {
  if (!S.league) return null;
  const nSims = opts.nSims || 1500, rng = mulberry32(opts.seed || 20260907);
  const st = S.league.settings, ps = st.playoff_week_start || 15, nPO = Math.min(st.playoff_teams || 6, S.rosters.length);
  const rids = S.rosters.map(r => r.roster_id);
  const from = Math.max(1, (st.last_scored_leg || 0) + 1), regWeeks = []; for (let w = from; w < ps; w++) regWeeks.push(w);
  const poWeeks = S.playoffWeeks;
  const mu = {}, sd = {};
  for (const rid of rids) {
    mu[rid] = {}; sd[rid] = {};
    for (const w of [...regWeeks, ...poWeeks]) { const L = optimalLineup(rosterMap[rid] || [], p => (p.weekly ? p.weekly[w - 1] : 0) || 0); mu[rid][w] = L.total; sd[rid][w] = Math.sqrt(sum(L.slots.map(s => s.p ? Math.pow(0.45 * s.p._v, 2) : 0))) + 3; }
  }
  const base = {}; for (const r of S.rosters) { const s = r.settings || {}; base[r.roster_id] = { w: s.wins || 0, pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100 }; }
  const sched = (S.schedule && S.schedule.schedule) || {}, median = !!st.league_average_match;
  const tally = {}; rids.forEach(r => tally[r] = { playoff: 0, bye: 0, final: 0, title: 0, wins: 0, seed: 0 });
  const play = (a, b, w) => (mu[a][w] + sd[a][w] * randn(rng)) > (mu[b][w] + sd[b][w] * randn(rng)) ? a : b;
  for (let s = 0; s < nSims; s++) {
    const W = {}, PF = {}; rids.forEach(r => { W[r] = base[r].w; PF[r] = base[r].pf; });
    for (const w of regWeeks) {
      const pairs = (sched[w] && sched[w].length) ? sched[w] : randomPairs(rids, rng);
      const sc = {}; rids.forEach(r => sc[r] = mu[r][w] + sd[r][w] * randn(rng));
      for (const [a, b] of pairs) { if (sc[a] > sc[b]) W[a]++; else W[b]++; }
      if (median) { const v = rids.map(r => sc[r]).sort((x, y) => x - y); const md = (v[Math.floor((v.length - 1) / 2)] + v[Math.ceil((v.length - 1) / 2)]) / 2; rids.forEach(r => { if (sc[r] > md) W[r]++; }); }
      rids.forEach(r => PF[r] += sc[r]);
    }
    const order = [...rids].sort((a, b) => (W[b] - W[a]) || (PF[b] - PF[a]));
    order.forEach((r, i) => { tally[r].wins += W[r]; tally[r].seed += i + 1; });
    const alive = order.slice(0, nPO); alive.forEach(r => tally[r].playoff++);
    const pw = i => poWeeks[Math.min(i, poWeeks.length - 1)];
    if (nPO === 6) {
      alive.slice(0, 2).forEach(r => tally[r].bye++);
      const r1 = [play(alive[2], alive[5], pw(0)), play(alive[3], alive[4], pw(0))].sort((a, b) => alive.indexOf(a) - alive.indexOf(b));
      const f = [play(alive[0], r1[1], pw(1)), play(alive[1], r1[0], pw(1))]; f.forEach(r => tally[r].final++); tally[play(f[0], f[1], pw(2))].title++;
    } else {
      let cur = alive, round = 0;
      while (cur.length > 1) { const next = []; if (cur.length % 2 === 1) { tally[cur[0]].bye++; next.push(cur[0]); cur = cur.slice(1); } for (let i = 0; i < cur.length / 2; i++) next.push(play(cur[i], cur[cur.length - 1 - i], pw(round))); if (next.length === 2) next.forEach(r => tally[r].final++); cur = next; round++; }
      tally[cur[0]].title++;
    }
  }
  const out = {}; rids.forEach(r => out[r] = { playoff: tally[r].playoff / nSims, bye: tally[r].bye / nSims, final: tally[r].final / nSims, title: tally[r].title / nSims, wins: tally[r].wins / nSims, seed: tally[r].seed / nSims });
  return { teams: out, nSims, regWeeks, scheduled: Object.keys(sched).length > 0, nPO };
}
function currentOdds() { if (!S.odds && S.league) S.odds = simSeason(currentRosterMap()); return S.odds; }

/* ---------- trade finder ---------- */
function tradeFinder() {
  if (!S.myRoster) return [];
  const key = 'val', myIds = S.myRoster.players || [];
  const skill = ids => ids.map(id => S.byId[id]).filter(p => p && p.pos !== 'K' && p.pos !== 'DEF').sort((a, b) => b.val - a.val);
  const combos = (arr, k) => k === 1 ? arr.map(x => [x]) : arr.flatMap((x, i) => arr.slice(i + 1).map(y => [x, y]));
  const mine = skill(myIds).slice(0, 9), myBase = teamValue(myIds, key), results = [];
  const sends = [...combos(mine, 1), ...combos(mine.slice(0, 7), 2)];
  for (const r of S.rosters) {
    if (r.roster_id === S.myRoster.roster_id) continue;
    const thIds = r.players || [], theirs = skill(thIds).slice(0, 9), thBase = teamValue(thIds, key);
    const gets = [...combos(theirs, 1), ...combos(theirs.slice(0, 7), 2)];
    for (const s of sends) for (const g of gets) {
      if (s.length === 2 && g.length === 2) continue;
      const sIds = s.map(p => p.id), gIds = g.map(p => p.id);
      const myGain = teamValue(myIds.filter(id => !sIds.includes(id)).concat(gIds), key) - myBase; if (myGain < 4) continue;
      const thGain = teamValue(thIds.filter(id => !gIds.includes(id)).concat(sIds), key) - thBase; if (thGain < -3) continue;
      results.push({ rid: r.roster_id, send: s, get: g, myGain, thGain, score: myGain + 0.5 * Math.min(thGain, 15) });
    }
  }
  return results.sort((a, b) => b.score - a.score).slice(0, 15);
}

/* ---------- FAAB price model from the league's own bid history ---------- */
function faabModel() {
  if (!S.faab || !S.faab.bids) return null;
  const bids = S.faab.bids.filter(b => b.rank && b.budget);
  const bucketOf = (rank, pos) => (pos === 'K' || pos === 'DEF') ? 'kdef' : rank <= 12 ? 'starter' : rank <= 24 ? 'flex' : rank <= 40 ? 'bench' : 'dart';
  const phaseOf = w => w <= 4 ? 'early' : w <= 10 ? 'mid' : 'late';
  const groups = {};
  for (const b of bids) { const pctb = 100 * b.bid / b.budget; const bk = bucketOf(b.rank, b.pos); for (const k of [bk, bk + '/' + phaseOf(b.week), bk === 'kdef' ? 'kdef' : 'all']) { const g = groups[k] = groups[k] || { won: [], lost: 0 }; if (b.won) g.won.push(pctb); else g.lost++; } }
  const q = (arr, f) => { if (!arr.length) return null; const a = [...arr].sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(f * a.length))]; };
  const stat = k => { const g = groups[k]; if (!g) return null; return { n: g.won.length, lost: g.lost, median: q(g.won, 0.5), p75: q(g.won, 0.75), max: g.won.length ? Math.max(...g.won) : null }; };
  const budget = S.league.settings.waiver_budget || 100;
  const suggest = (rank, week, pos) => {
    const b = bucketOf(rank, pos), keys = [b + '/' + phaseOf(week), b, b === 'kdef' ? 'kdef' : 'all'];
    for (const k of keys) { const s = stat(k); if (s && s.n >= (k === 'all' ? 1 : k.includes('/') ? 4 : 3)) return { ...s, key: k, typical: Math.round(s.median * budget / 100), safe: Math.round(s.p75 * budget / 100) }; }
    return null;
  };
  return { suggest, stat, bucketOf, budget, n: bids.length, seasons: S.faab.seasons };
}

/* ---------- lineup alerts ---------- */
function lineupAlerts() {
  const r = S.myRoster; if (!r) return [];
  const starters = (r.starters || []).filter(id => id && id !== '0');
  const L = optimalLineup(r.players || [], 'week'), optIds = new Set(L.slots.filter(s => s.p).map(s => s.p.id));
  const out = [];
  for (const id of starters) {
    const p = S.byId[id];
    if (!p) { out.push({ sev: 'bad', text: 'A starting slot holds an unknown or empty player' }); continue; }
    if (p.bye === S.wkNum) out.push({ sev: 'bad', p, text: `${p.name} is on bye this week` });
    else if (['Out', 'IR', 'PUP', 'Sus', 'NA', 'Doubtful'].includes(p.inj)) out.push({ sev: 'bad', p, text: `${p.name} is ${p.inj}${p.injNote ? ' (' + p.injNote + ')' : ''}` });
    else if (p.inj === 'Questionable') out.push({ sev: 'warn', p, text: `${p.name} is questionable${p.injNote ? ' (' + p.injNote + ')' : ''}; check inactives before kickoff` });
    else if (p.week < 2) out.push({ sev: 'warn', p, text: `${p.name} projects only ${f1(p.week)} pts` });
  }
  const benchIn = L.slots.filter(s => s.p && !starters.includes(s.p.id)).map(s => s.p), startOut = starters.map(id => S.byId[id]).filter(p => p && !optIds.has(p.id));
  const cur = sum(starters.map(id => S.byId[id] ? S.byId[id].week : 0));
  if (benchIn.length && L.total - cur > 0.5) out.push({ sev: 'warn', text: `Start ${benchIn.map(p => p.name).join(', ')} over ${startOut.map(p => p.name).join(', ') || 'the empty slot'} for +${f1(L.total - cur)} pts` });
  return out;
}
let _lastAlertKey = null;
function notifyAlerts(alerts) {
  const key = alerts.map(a => a.text).join('|');
  if (!alerts.length || key === _lastAlertKey) { _lastAlertKey = key; return; }
  _lastAlertKey = key;
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification('War Room lineup alert', { body: alerts.slice(0, 3).map(a => a.text).join('\n') });
}
async function refreshAlerts() {
  if (!S.league) return;
  try { S.rosters = await api(`sleeper/league/${S.league.league_id}/rosters`); S.myRoster = S.user ? S.rosters.find(r => r.owner_id === S.user.user_id || (r.co_owners || []).includes(S.user.user_id)) : null; await loadMatrix(); rebuildPlayers(); notifyAlerts(lineupAlerts()); if (S.tab === 'team') render(); } catch (e) {}
}
setInterval(refreshAlerts, 10 * 60 * 1000);

/* ---------- rendering helpers ---------- */
function pcell(p, opts = {}) {
  const inj = p.inj ? `<span class="injury ${p.inj === 'Questionable' ? 'Q' : ''}" title="${esc(p.injNote || '')}">${{Questionable:'Q',Doubtful:'D',Out:'O',IR:'IR',PUP:'PUP',Sus:'SUS',NA:'NA'}[p.inj] || esc(p.inj)}</span>` : '';
  const own = p.rosterId != null && !opts.noOwner ? `<span class="chip ${S.myRoster && p.rosterId === S.myRoster.roster_id ? 'acc' : ''}">${esc(S.myRoster && p.rosterId === S.myRoster.roster_id ? 'mine' : teamName(p.rosterId))}</span>` : '';
  const dis = p.disagree ? `<span class="chip warn" title="Sources disagree this week: Sleeper ${f1(p.srcWeek.sleeper)} vs ESPN ${f1(p.srcWeek.espn)}">±</span>` : '';
  return `<span class="pos ${p.pos}">${p.pos}</span> <b>${esc(p.name)}</b> <span class="muted small">${p.team || 'FA'}${p.bye ? ' · bye ' + p.bye : ''}</span>${inj}${dis}${own}`;
}
function sortRows(rows, key, def, desc = true) {
  const s = S.sort[key] || { by: def, desc };
  const by = s.by;
  return rows.sort((a, b) => { const x = a[by] ?? -Infinity, y = b[by] ?? -Infinity; if (x === y) return 0; return (x < y ? -1 : 1) * (s.desc ? -1 : 1); });
}
function th(key, label, by, cls = '') { const s = S.sort[key]; const arrow = s && s.by === by ? (s.desc ? ' ▼' : ' ▲') : ''; return `<th class="${cls}" data-sort="${key}:${by}">${label}${arrow}</th>`; }
function bindSort(scope) {
  scope.querySelectorAll('th[data-sort]').forEach(el => el.onclick = () => {
    const [key, by] = el.dataset.sort.split(':'); const s = S.sort[key];
    S.sort[key] = s && s.by === by ? { by, desc: !s.desc } : { by, desc: true }; render();
  });
}
function posFilter(rows) {
  const f = S.filters; let r = rows;
  if (f.pos !== 'ALL') r = r.filter(p => p.pos === f.pos);
  if (f.q) { const q = f.q.toLowerCase(); r = r.filter(p => p.name.toLowerCase().includes(q) || (p.team || '').toLowerCase() === q); }

}
function toolbar(extra = '') {

  const q = $('#q'); if (q) { q.oninput = () => { S.filters.q = q.value; render(); }; }

function probCell(pr) {

/* Plain-language pick guidance for the current (or upcoming) pick. */
function guidanceCard(B) {
  const { ctx, rows, sim, myNext, myNext2, nextPickNo, have, fixed, flex } = B;
  if (!ctx || !ctx.slot || ctx.status === 'complete' || !myNext || !rows.length) return '';
  const top = rows[0], later = sim ? (myNext2 ? sim.eBest2 : sim.eBest) : null, laterNo = (myNext2 || myNext).no;
  const startsPos = pos => fixed[pos] || flex.some(el => el.includes(pos));
  const reasons = p => {
    const r = [];
    r.push(`${p.pos}${p.tierSRank || ''} on the board, tier ${p.tierS || '–'}, <b>+${f0(p.vorpS)}</b> over replacement`);
    if (p.waitCost != null && later) r.push(p.waitCost > 10
      ? `Passing costs about <b>${f0(p.waitCost)} pts</b>: the best ${p.pos} expected at #${laterNo} is worth ~${f0(later[p.pos])}`
      : `Small drop-off at ${p.pos} by #${laterNo} (~${f0(later[p.pos])} still expected), so ${p.pos} can wait`);
    const h = have[p.pos] || 0;
    if (B.mustFill.has(p.pos)) r.push(`<span class="warn">You must fill ${p.pos} with one of your last picks</span>`);
    else if (B.emptySlots.includes(p.pos)) r.push(`Fills an empty ${p.pos} starting slot`);
    else if (B.emptySlots.some(sl => FLEX[sl] && FLEX[sl].includes(p.pos))) r.push(`${p.pos} starters are set; he starts in your ${B.emptySlots.find(sl => FLEX[sl] && FLEX[sl].includes(p.pos)).replace('_', ' ')} slot`);
    else if (p.displaced) r.push(`Upgrades your lineup by <b>${f0(p.gain)}</b> pts over ${esc(p.displaced.name)}, who moves to the bench`);
    else r.push(`You already have ${h} ${p.pos}; he would be bench depth, so he counts for only ${pct(p.vorpS > 0 ? p.value / p.vorpS : 0)} of his value`);
    if (p.adp) { const d = p.adp - nextPickNo; r.push(d > 12 ? `<span class="warn">Reach: ADP ${f1(p.adp)} is ${f0(d)} picks later than now</span>` : d < -6 ? `<span class="good">Value: ADP ${f1(p.adp)}, fell ${f0(-d)} picks</span>` : `Fair price at ADP ${f1(p.adp)}`); }
    if (p.inj) r.push(`<span class="warn">Injury flag: ${esc(p.inj)}${p.injNote ? ' (' + esc(p.injNote) + ')' : ''}</span>`);
    const sameBye = B.myPicked.filter(x => x.bye && x.bye === p.bye && startsPos(x.pos));
    if (sameBye.length) r.push(`Shares bye week ${p.bye} with ${sameBye.map(x => esc(x.name)).join(', ')}`);
    if (!B.onClock && p.probNext != null) r.push(`<b>${pct(p.probNext)}</b> chance he is still there at your pick #${myNext.no}`);
    return r;
  };
  const alts = rows.slice(1, 4);
  const planB = rows.find(p => p.pos === top.pos && p.id !== top.id);
  const canPick = ctx.kind === 'mock' && B.onClock;
  const expect = later ? POS.filter(pos => startsPos(pos) && pos !== 'K' && pos !== 'DEF').map(pos => `${pos} ~${f0(later[pos])}`).join(' · ') : '';
  return `<div class="card guide ${B.onClock ? 'clock' : ''}">
    <div class="guide-head"><h3>${B.onClock ? `<span class="dot live"></span>You are on the clock · pick #${nextPickNo}` : `${myNext.no - nextPickNo} pick${myNext.no - nextPickNo === 1 ? '' : 's'} until you are up (#${myNext.no}, round ${myNext.round})`}</h3>${canPick ? `<button class="primary" data-draft="${top.id}">Draft ${esc(top.name)}</button>` : ''}</div>
    <div class="guide-pick"><span class="pos ${top.pos}">${top.pos}</span> <span class="display" style="font-size:30px;font-weight:700">${esc(top.name)}</span> <span class="muted">${top.team || 'FA'} · bye ${top.bye || '–'} · ${f0(top.season)} pts</span><span class="chip acc">rec ${f0(top.rec)}</span></div>
    <ul class="why">${reasons(top).map(r => `<li>${r}</li>`).join('')}</ul>
    <div class="alts">${alts.map(p => `<div><span class="faint small">ALT</span> ${pcell(p, { noOwner: true })} <span class="muted small">rec ${f0(p.rec)} · +${f0(p.vorpS)}${p.waitCost != null ? ` · wait ${f0(p.waitCost)}` : ''}${!B.onClock && p.probNext != null ? ` · ${pct(p.probNext)} there` : ''}</span>${canPick ? ` <button class="tiny" data-draft="${p.id}">Draft</button>` : ''}</div>`).join('')}</div>
    ${planB ? `<div class="note">If he is gone: next ${top.pos} is ${esc(planB.name)} (+${f0(planB.vorpS)}).</div>` : ''}
    ${expect ? `<div class="note">Expected best value at #${laterNo} after this pick: ${expect}.</div>` : ''}
  </div>`;
}

function renderDraft(B) {
  const { ctx, picks, nextPickNo, myNext, myNext2, myPicked, have, fixed, flex, R, round, sim } = B;
  const drafting = ctx && ctx.status === 'drafting', done = ctx && ctx.status === 'complete';
  const isMock = ctx && ctx.kind === 'mock', canPick = isMock && B.onClock;
  if (!isMock) document.title = (B.onClock && drafting) ? '⏰ YOUR PICK · War Room' : 'War Room';
  let rows = posFilter(B.rows);
  sortRows(rows, 'draft', 'rec');
  const top = rows.slice(0, 250);
  const sugg = [...B.rows].slice(0, 5);
  const waitable = B.rows.filter(p => p.probNext != null && p.probNext > .75 && p.vorpS > 0).sort((a, b) => b.vorpS - a.vorpS).slice(0, 4);
  const mine = myPickNos(ctx);
  const pickStrip = ctx && ctx.slot ? `<div class="pick-list">${mine.map(p => `<span class="${p.no < nextPickNo ? 'done' : (myNext && p.no === myNext.no ? 'next' : '')}" title="Round ${p.round}">${p.round}.${String(p.no - (p.round - 1) * ctx.T).padStart(2, '0')} · #${p.no}</span>`).join('')}</div>` : '';
  const onClock = drafting ? ctx.nameOf(slotAtPick(nextPickNo, ctx.T, ctx.type, ctx.reversal)) : null;
  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">Draft</div><div class="v">${ctx ? (isMock ? 'mock' : esc(ctx.status.replace('_', ' '))) : 'no league'}</div><div class="s">${ctx ? `${ctx.type} · ${ctx.T} teams · ${R} rounds${ctx.reversal ? ' · 3RR' : ''}` : 'default 12-team board'}</div></div>
    <div class="tile"><div class="k">On the clock</div><div class="v">${drafting ? `<span class="dot live"></span>#${nextPickNo}` : done ? 'Done' : '–'}</div><div class="s">${onClock ? esc(onClock) + (B.onClock ? ' — YOU' : '') : (ctx ? 'round ' + round : '')}</div></div>
    <div class="tile"><div class="k">My next pick</div><div class="v">${myNext ? '#' + myNext.no : (ctx && !ctx.slot ? 'slot TBD' : '–')}</div><div class="s">${myNext ? `round ${myNext.round}${myNext2 ? ` · then #${myNext2.no}` : ''}` : ''}</div></div>
    <div class="tile"><div class="k">My roster</div><div class="v">${myPicked.length}<span class="muted" style="font-size:16px">/${R}</span></div><div class="s">${POS.map(p => `${p} ${have[p] || 0}`).join(' · ')}</div></div>

function waiverWhatIf(pid) {
  const p = S.byId[pid]; if (!p || !S.myRoster) return null;
  const ids = S.myRoster.players || [];

  if (!drop) return null;
  const map = currentRosterMap(); map[S.myRoster.roster_id] = ids.filter(id => id !== drop.id).concat([pid]);
  const before = currentOdds().teams[S.myRoster.roster_id], after = simSeason(map).teams[S.myRoster.roster_id];
  return { drop, dPlayoff: after.playoff - before.playoff, dTitle: after.title - before.title };
}

function faabCard(fm) {
  if (!S.league || S.league.settings.waiver_type !== 2) return '';

  const buckets = ['starter', 'flex', 'bench', 'dart', 'kdef'], phases = ['early', 'mid', 'late'];
  const cell = k => { const s = fm.stat(k); return s && s.n ? `<td class="r">$${Math.round(s.median * fm.budget / 100)}<span class="muted small"> / $${Math.round(s.p75 * fm.budget / 100)} · n${s.n}</span></td>` : '<td class="r muted">–</td>'; };
  const big = [...S.faab.bids].sort((a, b) => b.bid - a.bid).slice(0, 12);
  return `<div class="card" style="margin-top:16px"><h2>FAAB market in this league</h2><div class="note" style="margin:4px 0 8px">${fm.n} bids across ${fm.seasons.join(', ')}. Cells show the median / 75th-percentile winning bid for a target of that quality (positional rank by that week's projection) in that part of the season. Budget $${fm.budget}.</div>

    <div class="tablewrap"><table><thead><tr><th>Biggest bids</th><th>By</th><th class="r">Bid</th><th class="r">Rank</th></tr></thead><tbody>${big.map(b => `<tr><td>${esc(b.name)} <span class="muted small">${b.season} wk${b.week}</span></td><td class="small">${esc(b.team)}</td><td class="r ${b.won ? 'good' : 'muted'}">$${b.bid}${b.won ? '' : ' ✗'}</td><td class="r muted">${b.pos || ''}${b.rank || ''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}
function viewMatchup() {
  if (!S.league || !S.myRoster) return needLeague();

  if (!mm) return needLeague('No matchup scheduled for week ' + S.wkNum + '.');
  const opp = S.matchups.find(m => m.matchup_id === mm.matchup_id && m.roster_id !== mm.roster_id);
  const side = (m) => {
    const r = S.rosters.find(x => x.roster_id === m.roster_id);
    const starters = (m.starters && m.starters.length ? m.starters : r.starters || []).filter(id => id && id !== '0');
    const ps = starters.map(id => S.byId[id]).filter(Boolean);
    const proj = sum(ps.map(p => p.week)); const opt = optimalLineup(r.players || [], 'week');
    const sd = Math.sqrt(sum(ps.map(p => Math.pow(0.45 * p.week, 2))));
    return { r, ps, proj, opt, sd, actual: m.points, name: teamName(m.roster_id), starters };
  };
  const A = side(mm), B = opp ? side(opp) : null;
  const winP = B ? Phi((A.proj - B.proj) / Math.sqrt(A.sd * A.sd + B.sd * B.sd + 1)) : null;
  const tbl = (X, mineSide) => `<div class="card"><h2>${esc(X.name)}</h2><div class="big">${f1(X.proj)} <span class="muted" style="font-size:16px">proj</span>${X.actual ? `<span class="muted" style="font-size:18px"> · ${f1(X.actual)} scored</span>` : ''}</div>
    ${X.opt.total - X.proj > 0.5 ? `<div class="note ${mineSide ? 'warn' : 'muted'}">${mineSide ? 'You are' : 'They are'} leaving ${f1(X.opt.total - X.proj)} on the bench (optimal ${f1(X.opt.total)}).</div>` : ''}

    <div class="vs">${tbl(A, true)}<div class="mid">VS</div>${B ? tbl(B, false) : '<div class="card"><div class="empty">Bye week</div></div>'}</div>`;
}

  if (!S.trades) S.trades = tradeFinder();
  const finder = `<div class="card" style="margin-bottom:16px"><h2>Trade finder</h2><div class="note" style="margin:4px 0 8px">Every 1-for-1, 2-for-1 and 1-for-2 between your top players and each team's, kept when it lifts your ${basisLabel()} team value by 4+ and does not hurt theirs by more than 3. Ranked by your gain plus half of theirs, so the top offers are the ones most likely to be accepted.</div>
    ${S.trades.length ? `<div class="tablewrap"><table><thead><tr><th>Partner</th><th>You send</th><th>You get</th><th class="r">You</th><th class="r">Them</th><th></th></tr></thead><tbody>${S.trades.map((t, i) => `<tr><td>${esc(teamName(t.rid))}</td><td>${t.send.map(p => pcell(p, { noOwner: true })).join('<br>')}</td><td>${t.get.map(p => pcell(p, { noOwner: true })).join('<br>')}</td><td class="r good">+${f0(t.myGain)}</td><td class="r ${t.thGain >= 0 ? 'good' : 'warn'}">${t.thGain >= 0 ? '+' : ''}${f0(t.thGain)}</td><td><button class="tiny" data-load-trade="${i}">Evaluate</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No trade lifts your lineup without clearly hurting the other side. Try a different value basis.</div>'}</div>`;
  const verdict = !active ? 'Tick players on both sides to evaluate a trade.' : me.d > 3 && them.d > -3 ? '<span class="good">Good for you and fair enough to be accepted.</span>' : me.d > 3 ? '<span class="good">Great for you</span> — but they lose value, expect a no.' : me.d < -3 ? '<span class="bad">Bad for you.</span>' : 'Roughly even.';
  return `<div class="toolbar"><label class="f">Trade partner <select id="trade-team">${S.rosters.filter(r => r.roster_id !== S.myRoster.roster_id).map(r => `<option value="${r.roster_id}" ${r.roster_id === t.team ? 'selected' : ''}>${esc(teamName(r.roster_id))}</option>`).join('')}</select></label><button class="tiny" id="trade-clear">Clear</button></div>
    <div class="card" style="margin-bottom:16px"><h2>Trade verdict</h2><div style="font-size:16px;margin:6px 0">${verdict}</div>
    <div class="tiles" style="margin:10px 0 0"><div class="tile"><div class="k">Your team value</div><div class="v ${me.d > 0 ? 'good' : me.d < 0 ? 'bad' : ''}">${me.d > 0 ? '+' : ''}${f0(me.d)}</div><div class="s">${f0(me.b)} → ${f0(me.a)} · starters ${f0(me.lb)} → ${f0(me.la)}</div></div>
    ${them ? `<div class="tile"><div class="k">${esc(teamName(t.team))} value</div><div class="v ${them.d > 0 ? 'good' : them.d < 0 ? 'bad' : ''}">${them.d > 0 ? '+' : ''}${f0(them.d)}</div><div class="s">${f0(them.b)} → ${f0(them.a)} · starters ${f0(them.lb)} → ${f0(them.la)}</div></div>` : ''}</div>
    ${oddsLine}<div class="note">Team value = ${basisLabel()} points from the best lineup plus 35% of the top four bench players' value over replacement. A trade that helps both starting lineups is the one most likely to be accepted. Odds deltas come from re-simulating the season with the rosters swapped.</div></div>${finder}
    <div class="grid cols-2"><div class="card"><h3>You send</h3>${list(S.myRoster, t.mine, 'mine')}</div><div class="card"><h3>You receive from ${esc(their ? teamName(t.team) : '')}</h3>${their ? list(their, t.theirs, 'theirs') : ''}</div></div>`;
}
function bindTrade() {
  const sel = $('#trade-team'); if (sel) sel.onchange = () => { S.tradeSel.team = +sel.value; S.tradeSel.theirs.clear(); render(); };
  const c = $('#trade-clear'); if (c) c.onclick = () => { S.tradeSel.mine.clear(); S.tradeSel.theirs.clear(); render(); };
  const n = $('#btn-notify'); if (n) n.onclick = () => { if (typeof Notification === 'undefined') return; Notification.requestPermission().then(() => render()); };
  document.querySelectorAll('[data-load-trade]').forEach(b => b.onclick = () => { const t = S.trades[+b.dataset.loadTrade]; S.tradeSel.team = t.rid; S.tradeSel.mine = new Set(t.send.map(p => p.id)); S.tradeSel.theirs = new Set(t.get.map(p => p.id)); render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-whatif]').forEach(b => b.onclick = () => { S.whatIf = S.whatIf || {}; S.whatIf[b.dataset.whatif] = waiverWhatIf(b.dataset.whatif); render(); });
  document.querySelectorAll('input.check').forEach(cb => cb.onchange = () => { const set = S.tradeSel[cb.dataset.who]; cb.checked ? set.add(cb.dataset.id) : set.delete(cb.dataset.id); render(); });
}

function viewModel() {
  const m = S.matrix;
  if (S.accuracy == null) { S.accuracy = 'loading'; api('accuracy?season=' + S.state.season).then(a => { S.accuracy = a; if (S.tab === 'model') render(); }).catch(() => { S.accuracy = { weeks: [], sources: {}, weights_source: '' }; }); }
  const acc = S.accuracy && S.accuracy !== 'loading' ? S.accuracy : null;
  const dis = S.P.filter(p => p.srcWeek.sleeper != null && p.srcWeek.espn != null && Math.max(p.srcWeek.sleeper, p.srcWeek.espn) >= 8).map(p => ({ p, d: p.srcWeek.espn - p.srcWeek.sleeper })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 15);
  const srcRow = per => POS.map(pos => { const b = per && per[pos]; return `<td class="r">${b && b.n ? `${f1(b.mae)} <span class="muted small">n${b.n}</span>` : '–'}</td>`; }).join('') + `<td class="r"><b>${per && per.ALL && per.ALL.n ? f1(per.ALL.mae) : '–'}</b></td><td class="r muted">${per && per.ALL && per.ALL.n ? (per.ALL.bias > 0 ? '+' : '') + f1(per.ALL.bias) : ''}</td>`;
  return `<div class="tiles">
      <div class="tile"><div class="k">Sources</div><div class="v">${m.espn_ok ? 2 : 1}</div><div class="s">Sleeper/Rotowire${m.espn_ok ? ' + ESPN' : ' (ESPN unavailable)'}</div></div>
      <div class="tile"><div class="k">Consensus weights</div><div class="v">${Math.round(m.weights.sleeper * 100)}<span class="muted" style="font-size:16px">/${Math.round(m.weights.espn * 100)}</span></div><div class="s">${acc ? esc(acc.weights_source) : ''}</div></div>
      <div class="tile"><div class="k">Completed weeks</div><div class="v">${acc ? acc.weeks.length : '–'}</div><div class="s">graded against actual PPR points</div></div>
      <div class="tile"><div class="k">ESPN weekly coverage</div><div class="v">${m.espn_weeks.length}</div><div class="s">weeks with ESPN lines</div></div>
    </div>
    <div class="grid cols-2"><div class="card"><h2>Projection accuracy</h2>
      ${acc && Object.keys(acc.sources).length ? `<div class="tablewrap"><table><thead><tr><th>Source</th>${POS.map(p => `<th class="r">${p}</th>`).join('')}<th class="r">All MAE</th><th class="r">Bias</th></tr></thead><tbody>${Object.entries(acc.sources).map(([s, per]) => `<tr><td><b>${s}</b></td>${srcRow(per)}</tr>`).join('')}</tbody></table></div><div class="note">Mean absolute error in PPR points per player-week (players projected 5+ pts). Bias = actual minus projected: positive means the source runs low. Weights switch to inverse-MSE once both sources have 100+ graded player-weeks.</div>` : `<div class="empty">No completed weeks yet. Each week's projections are frozen on load; once games finish, actuals are pulled and graded here, and the consensus reweights automatically.</div>`}
    </div>
    <div class="card"><h2>Biggest disagreements · week ${S.wkNum}</h2><div class="tablewrap"><table><thead><tr><th>Player</th><th class="r">Sleeper</th><th class="r">ESPN</th><th class="r">Δ</th></tr></thead><tbody>${dis.map(({ p, d }) => `<tr><td>${pcell(p)}</td><td class="r">${f1(p.srcWeek.sleeper)}</td><td class="r">${f1(p.srcWeek.espn)}</td><td class="r ${d > 0 ? 'good' : 'bad'}">${d > 0 ? '+' : ''}${f1(d)}</td></tr>`).join('')}</tbody></table></div><div class="note">Where the sources split, the truth is usually in between, but a big gap is a signal to read the news before you commit. Players with a ± chip elsewhere in the app are on this list.</div></div></div>`;
}

/* ---------- boot ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; LS.set('tab', S.tab); render(); });
$('#user-form').onsubmit = e => { e.preventDefault(); loadUser().catch(er => setStatus('Could not load user: ' + er.message, true)); };
$('#league-select').onchange = e => { S.leagueId = e.target.value; loadLeague().catch(er => setStatus(er.message, true)); };
$('#week-select').onchange = e => { setStatus('Loading week ' + e.target.value + '…'); loadWeek(+e.target.value).then(() => setStatus('Week ' + S.wkNum + ' loaded')).catch(er => setStatus(er.message, true)); };
$('#scoring-select').value = S.defScoring;
$('#basis-select').value = S.basis;
$('#basis-select').onchange = e => { S.basis = e.target.value; LS.set('basis', S.basis); rebuildPlayers(); render(); };
$('#scoring-select').onchange = e => { S.defScoring = e.target.value; LS.set('defScoring', S.defScoring); Promise.all([loadADP(), loadMatrix()]).then(() => { rebuildPlayers(); render(); setStatus('Rankings only · default 12-team ' + e.target.selectedOptions[0].text); }); };
$('#btn-refresh').onclick = () => (S.leagueId ? loadLeague() : Promise.resolve()).catch(er => setStatus(er.message, true));
(async () => {
  try {
    $('#username').value = S.username;
    await loadBase();
    rebuildPlayers(); render();
    setStatus('Rankings ready · default 12-team ' + $('#scoring-select').selectedOptions[0].text);
    if (S.username) await loadUser();
  } catch (e) { setStatus('Load failed: ' + e.message, true); $('#view').innerHTML = `<div class="empty bad">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
